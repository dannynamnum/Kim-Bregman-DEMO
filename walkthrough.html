<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A walkthrough for Kim Bregman</title>
<meta name="description" content="A personal walkthrough of a demo built for Kim Bregman of Optima Properties.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Walkthrough palette — must match index.html (Option C — Navy & Seaglass) */
    --cream: #F2EFE8;
    --warm-white: #F8F5EE;
    --dark: #1B2F3F;
    --dark-soft: #38556B;
    --accent: #7AB5AA;
    --accent-dark: #4A8479;
    --accent-light: #C9DDD7;
    --sand: #DBD5C9;
    --text-muted: #5C504A;
    --accent-rgb: 122, 181, 170;
    --dark-rgb: 27, 47, 63;
    --warm-white-rgb: 248, 245, 238;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: var(--dark-soft);
    background: var(--warm-white);
    padding-bottom: 64px; /* sticky bar offset desktop */
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header (condensed) ---------- */
  .header {
    text-align: center;
    padding: 28px 24px 0;
  }
  .wordmark {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--dark);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent-dark);
    margin-bottom: 20px;
    font-weight: 500;
  }

  /* ---------- Video ---------- */
  .video-wrap {
    max-width: 360px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .video-aspect {
    position: relative;
    padding-bottom: 217.4129353233831%;
    height: 0;
    background: var(--dark);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 24px 60px -24px rgba(var(--dark-rgb), 0.35);
  }
  .video-aspect iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Below-fold ---------- */
  .below {
    text-align: center;
    padding: 36px 24px 48px;
  }
  .btn-demo {
    display: inline-block;
    background: var(--dark);
    color: var(--warm-white);
    text-decoration: none;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: background 0.25s ease, transform 0.25s ease;
    margin-bottom: 22px;
  }
  .btn-demo:hover {
    background: var(--dark-soft);
    transform: translateY(-1px);
  }
  .how-link {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 0.04em;
  }
  .how-link u {
    text-decoration: underline;
    text-decoration-color: var(--accent-dark);
    text-underline-offset: 3px;
    color: var(--dark);
  }
  .how-link:hover u {
    text-decoration-color: var(--accent);
  }

  /* ---------- Footer (subtle attribution) ---------- */
  .attribution {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    padding: 0 24px 24px;
    opacity: 0.7;
  }

  /* ---------- Sticky CTA Bar — Danny's brand ---------- */
  .sticky {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 200;
    background: #F0EDE8;
    border-top: 1px solid rgba(0,0,0,0.08);
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }
  .sticky-inner {
    max-width: 480px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .sticky-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #3A3530;
    white-space: nowrap;
  }
  .sticky-btn {
    background: #151821;
    color: #F0EDE8;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 11px 24px;
    border-radius: 2px;
    transition: background 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sticky-btn .arrow {
    display: inline-block;
    transition: transform 0.25s ease;
  }
  .sticky-btn:hover {
    background: #2C2A33;
    transform: translateY(-1px);
  }
  .sticky-btn:hover .arrow {
    transform: translateX(3px);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    body { padding-bottom: 60px; }
    .header { padding: 20px 16px 0; }
    .wordmark { font-size: 19px; margin-bottom: 14px; }
    .eyebrow { font-size: 9px; margin-bottom: 16px; }
    .video-wrap { max-width: 100%; padding: 0 16px; }
    .below { padding: 28px 20px 36px; }
    .btn-demo { padding: 13px 24px; font-size: 11px; }
    .sticky { height: 60px; padding: 0 16px; }
    .sticky-label { font-size: 12px; }
    .sticky-btn { font-size: 12px; padding: 10px 18px; }
  }

  @media (max-width: 380px) {
    .sticky-inner { gap: 12px; }
    .sticky-label { font-size: 11px; }
    .sticky-btn { padding: 9px 14px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="https://kim-bregman-demo.vercel.app/" class="wordmark">Kim Bregman</a>
  <div class="eyebrow">A personal walkthrough</div>
</header>

<div class="video-wrap">
  <div class="video-aspect">
    <iframe src="https://www.loom.com/embed/3f315f164afc4fd781ce950423f13b7d?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true&hideLogo=true"
            frameborder="0"
            webkitallowfullscreen mozallowfullscreen allowfullscreen
            title="A walkthrough for Kim Bregman"></iframe>
  </div>
</div>

<section class="below">
  <a href="https://kim-bregman-demo.vercel.app/" class="btn-demo">View Your Demo</a>
  <a href="https://namnumdesign.co" class="how-link">How this <u>works</u></a>
</section>

<p class="attribution">Built by Danny Namnum &middot; namnumdesign.co</p>

<div class="sticky">
  <div class="sticky-inner">
    <span class="sticky-label">Like what you see?</span>
    <a href="https://fantastical.app/Namnum/Intro-conversation" target="_blank" rel="noopener" class="sticky-btn">
      Let's Talk <span class="arrow">→</span>
    </a>
  </div>
</div>

</body>
</html>
